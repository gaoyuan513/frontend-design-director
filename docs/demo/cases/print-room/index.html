<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f2e9">
<title>印刷所开放日 · Print Room</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f5f2e9;
    --ink: #181711;
    --subtle: #645e52;
    --rule: #c3bbac;
    --red: #b92a1a;
    --press-red: #e03824;
    --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; }
  a, button, select { -webkit-tap-highlight-color: #b92a1a1f; }
  button, select { font: inherit; }
  button, select { color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  [hidden] { display: none !important; }
  .sheet { width: min(1336px, calc(100% - clamp(32px, 7.2vw, 112px))); margin-inline: auto; }
  .skip {
    position: absolute; z-index: 2; top: 8px; left: 12px; padding: 10px;
    transform: translateY(-150%); background: var(--ink); color: var(--paper);
  }
  .skip:focus { transform: none; }
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 68px; border-bottom: 1px solid var(--ink);
  }
  .wordmark { display: flex; align-items: center; gap: 10px; font: 700 15px/1 Arial, sans-serif; }
  .seal { width: 18px; height: 18px; display: inline-block; background: conic-gradient(var(--red) 0 25%, transparent 0 50%, var(--red) 0 75%, transparent 0); }
  .masthead a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; text-decoration: none; }
  .masthead a:hover { color: var(--red); text-decoration: underline; text-underline-offset: 4px; }
  .hero {
    display: grid; grid-template-columns: 1fr 1.08fr; align-items: stretch;
    gap: clamp(24px, 5vw, 78px); padding-block: clamp(27px, 4vw, 54px);
  }
  .hero-copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: clamp(16px, 2vw, 30px); }
  .hero-dates { font: 600 14px/1.3 var(--mono); color: var(--red); letter-spacing: .018em; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(62px, 8.6vw, 132px); font-weight: 900; line-height: .98; letter-spacing: -.085em; }
  h1 span { display: block; }
  .hero-caption { font-size: clamp(14px, 1.5vw, 17px); line-height: 1.65; font-weight: 600; }
  .poster {
    position: relative; isolation: isolate; overflow: hidden; display: grid;
    place-items: center; aspect-ratio: 1.59; min-width: 0; min-height: 0;
    background: var(--press-red);
  }
  .poster::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle, #1d0c0b27 0 .46px, transparent .73px);
    background-size: 3px 3px; opacity: .48;
  }
  .poster-registration { position: absolute; inset: clamp(10px, 1.6vw, 24px); border: 1px solid #1e17114b; }
  .poster-registration i { position: absolute; width: 13px; height: 13px; background: linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat; opacity: .65; }
  .poster-registration i:nth-child(1) { top: -7px; left: -7px; }
  .poster-registration i:nth-child(2) { top: -7px; right: -7px; }
  .poster-registration i:nth-child(3) { bottom: -7px; left: -7px; }
  .poster-registration i:nth-child(4) { bottom: -7px; right: -7px; }
  .poster-forms { position: absolute; inset: 12% 13%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  .poster-forms i { display: block; min-width: 0; min-height: 0; }
  .poster-forms i:nth-child(1) { margin-block: 2% 10%; margin-inline: 12% 8%; border-radius: 50%; background: var(--ink); }
  .poster-forms i:nth-child(2) { background: repeating-linear-gradient(0deg, var(--ink) 0 8%, transparent 8% 15%); clip-path: polygon(0% 0%, 100% 0%, 100% 100%); }
  .poster-forms i:nth-child(3) { background: #f2d9a6; border-radius: 100% 0 0 0; }
  .poster-forms i:nth-child(4) { background: #f2d9a6; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .poster-forms i:nth-child(5) { margin: 2% 7%; border-radius: 50%; background: radial-gradient(ellipse at center, #f2d9a6 0 17%, transparent 18% 33%, var(--ink) 34% 45%, transparent 46% 57%, var(--ink) 58% 70%, transparent 71%); }
  .poster-forms i:nth-child(6) { background: radial-gradient(circle, var(--ink) 0 1.2px, transparent 1.5px); background-size: clamp(5px, 1.1vw, 13px) clamp(5px, 1.1vw, 13px); margin: 9% 2% 0 10%; }
  .program { border-top: 2px solid var(--ink); padding-top: 19px; }
  .program-head { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding-bottom: 18px; }
  .program-heading { display: flex; align-items: baseline; gap: 13px; flex-wrap: wrap; }
  .program-heading h2 { font-size: clamp(28px, 3.3vw, 44px); line-height: 1.1; letter-spacing: -.07em; }
  .sample { font-size: 12px; color: var(--subtle); }
  .filters { display: flex; align-items: end; gap: 12px; }
  .filter { display: grid; gap: 4px; font-size: 12px; font-weight: 650; color: var(--subtle); }
  .filters select { min-height: 43px; min-width: 129px; background: transparent; border: 1px solid var(--ink); border-radius: 0; padding: 6px 24px 6px 10px; font-size: 14px; }
  .filters select:hover { border-color: var(--red); }
  .listing { --columns: minmax(88px, 1fr) minmax(200px, 3.4fr) minmax(72px, .78fr) minmax(90px, 1fr) 20px; }
  .list-head, .session {
    width: 100%; display: grid; grid-template-columns: var(--columns); align-items: center;
    gap: 14px; text-align: left; padding-inline: 4px;
  }
  .list-head { padding-block: 8px; border-block: 1px solid var(--rule); color: var(--subtle); font-size: 12px; }
  .session-list { list-style: none; margin: 0; padding: 0; }
  .session-list li { border-bottom: 1px solid var(--rule); }
  .session { border: 0; background: transparent; padding-block: 15px; text-align: left; min-height: 61px; }
  .session:hover { color: var(--red); background: #b92a1a08; }
  .session:focus-visible { outline-offset: -2px; }
  .session strong { font-size: clamp(16px, 2vw, 23px); letter-spacing: -.035em; line-height: 1.24; }
  .session-date { display: flex; align-items: baseline; gap: 8px; font: 600 14px/1.35 var(--mono); color: var(--red); }
  .session-date span { font-size: 12px; color: var(--subtle); }
  .session i { justify-self: end; font: normal 20px/1 Arial, sans-serif; color: var(--red); }
  .category, .length { font-size: 13px; }
  .no-results { border-bottom: 1px solid var(--rule); padding: 18px 4px; font-size: 14px; }
  .result-summary { min-height: 42px; padding-block: 10px; font-size: 13px; color: var(--subtle); }
  footer { display: flex; justify-content: space-between; gap: 14px; margin-block: 28px 24px; padding-top: 11px; border-top: 1px solid var(--ink); color: var(--subtle); font-size: 12px; }
  dialog {
    width: min(560px, calc(100% - 32px)); max-height: min(650px, calc(100dvh - 32px));
    color: var(--ink); background: var(--paper); border: 1px solid var(--ink);
    border-top: 8px solid var(--red); padding: 0; box-shadow: 12px 14px 0 #18171123;
    overscroll-behavior: contain;
  }
  dialog::backdrop { background: #18171180; }
  .detail-body { padding: clamp(18px, 4vw, 32px); }
  .detail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .detail-meta { font-size: 13px; font-weight: 700; color: var(--red); }
  .close { min-width: 66px; min-height: 44px; border: 1px solid var(--ink); padding: 6px 9px; background: transparent; }
  .close:hover { color: var(--red); border-color: var(--red); }
  .detail-body h2 { margin-top: 11px; font-size: clamp(24px, 5vw, 38px); letter-spacing: -.052em; }
  .detail-description { margin-block: 13px 21px; font-size: 15px; line-height: 1.7; }
  .prep { border-block: 1px solid var(--rule); padding-block: 11px; }
  .prep h3 { font-size: 15px; }
  .prep ul { padding-left: 1.3em; line-height: 1.68; margin: 7px 0 0; font-size: 14px; }
  .download { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; margin-top: 18px; padding-inline: 15px; border: 1px solid var(--red); background: var(--red); color: white; text-decoration: none; font-size: 14px; }
  .download:hover { background: #9e2418; }
  @media (max-width: 800px) {
    .hero { grid-template-columns: minmax(0, .92fr) minmax(0, 1fr); gap: 20px; }
    h1 { font-size: clamp(54px, 10vw, 83px); }
    .hero-copy { gap: 12px; }
    .poster { align-self: stretch; aspect-ratio: auto; }
  }
  @media (max-width: 600px) {
    .masthead { min-height: 56px; }
    .hero { grid-template-columns: 1fr; padding-block: 25px 27px; }
    .hero-copy { gap: 14px; }
    h1 { font-size: clamp(47px, 14.4vw, 74px); letter-spacing: -.065em; }
    h1 span { display: inline; }
    .poster { aspect-ratio: 1.9; }
    .program { padding-top: 15px; }
    .program-head { flex-direction: column; align-items: stretch; padding-bottom: 15px; gap: 13px; }
    .filter { flex: 1; min-width: 0; }
    .filters select { min-width: 0; }
    .list-head { display: none; }
    .session-list { border-top: 1px solid var(--rule); }
    .session { grid-template-columns: minmax(0, 1fr) auto 14px; gap: 4px 10px; }
    .session-date { grid-column: 1; grid-row: 1; }
    .session strong { grid-column: 1; grid-row: 2; }
    .category { grid-column: 2; grid-row: 1; text-align: right; }
    .length { grid-column: 2; grid-row: 2; text-align: right; }
    .session i { grid-row: 1 / 3; grid-column: 3; font-size: 16px; }
  }
  @media (max-width: 365px) {
    h1 { font-size: clamp(39px, 13.8vw, 49px); }
    .hero-caption { font-size: 13px; }
  }
</style>
</head>
<body>
<a class="skip" href="#program">跳到活动场次</a>
<header class="masthead sheet">
  <span class="wordmark" lang="en"><span class="seal" aria-hidden="true"></span>Print Room</span>
  <a href="../"><span aria-hidden="true">←</span> 返回案例集</a>
</header>

<main class="sheet">
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-copy">
      <p class="hero-dates"><time datetime="2026-12-05">2026.12.05</time>–<time datetime="2026-12-06">06</time></p>
      <h1 id="page-title"><span>印刷所</span><span>开放日</span></h1>
      <p class="hero-caption">排一行铅字，压一张海报，带走一本手订小册。</p>
    </div>
    <div class="poster" aria-hidden="true">
      <div class="poster-registration"><i></i><i></i><i></i><i></i></div>
      <div class="poster-forms"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>

  <section class="program" id="program" aria-labelledby="program-title">
    <div class="program-head">
      <div class="program-heading">
        <h2 id="program-title">活动场次</h2>
        <p class="sample">演示日程</p>
      </div>
      <div class="filters" role="group" aria-label="筛选场次">
        <div class="filter">
          <label for="day">日期</label>
          <select id="day">
            <option value="">全部日期</option>
            <option value="05">12 月 5 日 · 周六</option>
            <option value="06">12 月 6 日 · 周日</option>
          </select>
        </div>
        <div class="filter">
          <label for="category">活动类型</label>
          <select id="category">
            <option value="">全部类型</option>
            <option value="workshop">工坊</option>
            <option value="tour">导览</option>
            <option value="demonstration">示范</option>
          </select>
        </div>
      </div>
    </div>

    <div class="listing">
      <div class="list-head" aria-hidden="true"><span>日期 / 时间</span><span>场次</span><span>类型</span><span>时长</span><span></span></div>
      <ol class="session-list">
        <li data-day="05" data-category="workshop">
          <button class="session" id="type" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-05T10:00"><span>12.05</span> 10:00</time>
            <strong>铅字排印入门</strong><span class="category">工坊</span><span class="length">90 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
        <li data-day="05" data-category="tour">
          <button class="session" id="press" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-05T13:30"><span>12.05</span> 13:30</time>
            <strong>从字柜到平压机</strong><span class="category">导览</span><span class="length">40 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
        <li data-day="05" data-category="workshop">
          <button class="session" id="bind" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-05T15:00"><span>12.05</span> 15:00</time>
            <strong>一张纸的装订实验</strong><span class="category">工坊</span><span class="length">60 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
        <li data-day="06" data-category="demonstration">
          <button class="session" id="poster" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-06T10:00"><span>12.06</span> 10:00</time>
            <strong>双色套印示范</strong><span class="category">示范</span><span class="length">45 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
        <li data-day="06" data-category="workshop">
          <button class="session" id="paper" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-06T13:30"><span>12.06</span> 13:30</time>
            <strong>纸张、油墨与触感</strong><span class="category">工坊</span><span class="length">75 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
        <li data-day="06" data-category="demonstration">
          <button class="session" id="register" type="button" aria-haspopup="dialog">
            <time class="session-date" datetime="2026-12-06T15:30"><span>12.06</span> 15:30</time>
            <strong>如何读懂试印样张</strong><span class="category">示范</span><span class="length">30 分钟</span><i aria-hidden="true">↗</i>
          </button>
        </li>
      </ol>
      <p class="no-results" id="no-results" hidden>这一天没有该类型的场次。试试修改日期或活动类型。</p>
      <p class="result-summary" id="result-summary" role="status">共 6 场</p>
    </div>
  </section>
</main>

<footer class="sheet"><span>Print Room</span><span>前端排版案例 · 演示数据</span></footer>

<dialog aria-labelledby="detail-title" aria-describedby="detail-description" id="detail">
  <div class="detail-body">
    <div class="detail-top">
      <p class="detail-meta" id="detail-meta"></p>
      <form method="dialog"><button class="close" type="submit" autofocus>关闭</button></form>
    </div>
    <h2 id="detail-title"></h2>
    <p class="detail-description" id="detail-description"></p>
    <section class="prep" aria-labelledby="prep-title">
      <h3 id="prep-title">准备清单</h3>
      <ul id="prep-list"></ul>
    </section>
    <a class="download" id="download" download>下载准备清单 <span aria-hidden="true">↓</span></a>
  </div>
</dialog>

<script>
  const details = {
    type: {
      description: "在排字尺里排一行短句，锁定字模，再比较三种压印力度在同一张纸上的效果。",
      materials: ["想好一句不超过八个字的短句", "准备一个能平放 A5 印样的纸袋"]
    },
    press: {
      description: "从字柜的取字顺序出发，沿着排版、上墨和对位的工序，走到平压机旁看一张海报成形。",
      materials: ["穿适合站立和走动的鞋", "准备一本记录工序的笔记本"]
    },
    bind: {
      description: "用一张纸做折页，练习沿纸纹方向压线，再用三孔缝订把散页装订成小册。",
      materials: ["带一张 A4 纸或一份愿意改作封面的旧印样", "准备一支铅笔标记折线"]
    },
    poster: {
      description: "观察两块色版怎样对位。比较黄底压红与红底压黄两张试印，找出套印边缘的变化。",
      materials: ["准备一张纸记录两次上色的顺序", "留意样张四周的套准标记"]
    },
    paper: {
      description: "把同一种油墨压在棉纸、新闻纸和未涂布纸上，沿吸墨、留边和触感给各自的样张做注记。",
      materials: ["带一小张想要比较的未涂布纸", "带一个夹子固定干燥后的样张"]
    },
    register: {
      description: "用放大镜观察试印上的墨点、纸纤维和错位边。从诊断痕迹开始，倒推印刷时该改动哪一步。",
      materials: ["准备一张手边的印刷品", "记下最想看清的一处色彩交界"]
    }
  };

  const byId = (id) => document.getElementById(id);
  const day = byId("day");
  const category = byId("category");
  const dialog = byId("detail");
  const download = byId("download");
  const sessions = Array.from(document.querySelectorAll(".session-list li"));
  let opener;
  let downloadUrl;

  function filterSessions() {
    let count = 0;
    for (const item of sessions) {
      const matchesDay = !day.value || item.dataset.day === day.value;
      const matchesCategory = !category.value || item.dataset.category === category.value;
      item.hidden = !(matchesDay && matchesCategory);
      if (!item.hidden) count++;
    }
    byId("no-results").hidden = count !== 0;
    byId("result-summary").textContent = "共 " + count + " 场";
  }

  function showDetails(button) {
    opener = button;
    const title = button.querySelector("strong").textContent;
    const when = button.querySelector("time").textContent.trim();
    const type = button.querySelector(".category").textContent;
    const length = button.querySelector(".length").textContent;
    const { description, materials } = details[button.id];

    byId("detail-title").textContent = title;
    byId("detail-meta").textContent = [when, type, length].join(" / ");
    byId("detail-description").textContent = description;
    const items = materials.map((material) => {
      const li = document.createElement("li");
      li.textContent = material;
      return li;
    });
    byId("prep-list").replaceChildren(...items);
    const checklist = ["印刷所开放日 · 演示日程", title, when, "", "准备清单", ...materials.map((item) => "• " + item)];
    downloadUrl = URL.createObjectURL(new Blob([checklist.join("\r\n")], {type: "text/plain;charset=utf-8"}));
    download.href = downloadUrl;
    download.download = title + "-准备清单.txt";
    dialog.showModal();
  }

  day.addEventListener("change", filterSessions);
  category.addEventListener("change", filterSessions);
  for (const item of sessions) {
    const button = item.querySelector("button");
    button.addEventListener("click", () => showDetails(button));
  }
  dialog.addEventListener("close", () => {
    URL.revokeObjectURL(downloadUrl);
    download.removeAttribute("href");
    opener?.focus({preventScroll: true});
  });
</script>
</body>
</html>
